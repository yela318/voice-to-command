[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-to-command"
version = "0.2.0"
description = "Korean speech -> English text, via faster-whisper"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["speech-to-text", "asr", "whisper", "translation", "korean"]
dependencies = [
    "numpy>=1.19",
    "faster-whisper>=0.10",
    # no prebuilt wheel for newer tokenizers on Python 3.8
    "tokenizers<0.21; python_version < '3.9'",
]

[project.optional-dependencies]
# Live microphone capture (needs the PortAudio system library).
mic = ["sounddevice>=0.4"]
dev = ["pytest>=7", "ruff>=0.1"]

[project.scripts]
v2c = "voice_to_command.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_to_command"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads / runs the whisper model"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
