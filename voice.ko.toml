# voice.ko.toml — speak Korean, get an English prompt.
#
#   v2c listen -c voice.ko.toml
#   v2c transcribe command_ko.wav -c voice.ko.toml
#   Recognizer.from_config("voice.ko.toml")
#
# How it works: Whisper's task = "translate" emits English in one pass, so no
# separate translator (and no Papago credentials) is needed. translate.mode is
# left at "auto" — the Recognizer sees the backend already produced the target
# language and just records translated = True.
#
# For a Korean-in / Korean-out setup instead, use task = "transcribe" and
# translate.mode = "never".

timing = false

[asr]
backend  = "whisper"
language = "ko"            # pin the spoken language — faster, steadier on short clips

[asr.whisper]
model        = "small"     # MUST be multilingual — NOT a ".en" model. "base" is
                           # faster to cold-load; "medium" translates better.
device       = "cpu"       # set to "cuda" if a GPU is available
compute_type = ""          # "" = int8 on cpu, float16 on cuda
cpu_threads  = 0           # 0 = library default; e.g. 4 to use more CPU cores

[asr.options]
task = "translate"         # Korean speech -> English text in one shot

[translate]
mode   = "auto"            # auto = translate iff spoken != target
target = "en"
# backend unused here — Whisper self-translates. Set it (and NCP_PAPAGO_* env
# vars) only if you switch task back to "transcribe".

[normalize]
lowercase         = true
strip_punctuation = true
# phrase_map = { "black ball" = "black bowl" }   # fix recurring mistranslations here
